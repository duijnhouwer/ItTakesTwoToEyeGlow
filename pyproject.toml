[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeglow-egobody"
version = "0.1.0"
description = "EyeGlow synthetic desktop rendering spike"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3", "PySide6-Essentials==6.11.2", "pyvista==0.49.0", "pyvistaqt==0.13.1", "pillow==12.3.0", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
eyeglow-egobody = "eyeglow_egobody.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
eyeglow_egobody = ["resources/qt_plugins/**/*.so"]
